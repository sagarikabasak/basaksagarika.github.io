<header class="site-header" id="top">
  <a class="identity" href="/" aria-label="{{profile:Name}}, home">
    <span class="identity-mark" aria-hidden="true">{{profile:Initials}}</span>
    <span class="identity-copy"><strong>{{profile:Name}}</strong><small>{{profile:Header subtitle}}</small></span>
  </a>
  <nav class="desktop-nav" aria-label="Primary navigation">{{nav:primary}}</nav>
  <nav class="utility-nav" aria-label="Utilities">{{nav:utilities}}</nav>
  <details class="mobile-nav">
    <summary aria-label="Open navigation"><span>{{profile:Menu label}}</span><i aria-hidden="true"></i></summary>
    <nav aria-label="Mobile navigation">{{nav:mobile}}</nav>
  </details>
</header>
